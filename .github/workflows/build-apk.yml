# Builds a signed, installable release APK.
#   - every run: the APK is attached to the run as a plain (unzipped) artifact
#   - pushes to main/master and manual runs: the pre-release "Latest build" (tag `latest`) is
#     replaced, so the newest APK is always at
#     https://github.com/<owner>/<repo>/releases/download/latest/roost.apk
#   - tags v*: also published as their own GitHub Release
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ROOST_KEYSTORE_BASE64    the release keystore, base64-encoded
#   ROOST_KEYSTORE_PASSWORD  keystore password
#   ROOST_KEY_ALIAS          key alias inside the keystore
#   ROOST_KEY_PASSWORD       key password
# Every build must be signed with the same key, or Android refuses to install it as an update.
name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

# A newer push supersedes a build still running, so two builds never race to replace "latest".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create releases
    steps:
      - uses: actions/checkout@v4

      # Matches gradle/gradle-daemon-jvm.properties, so Gradle doesn't download another JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          ROOST_KEYSTORE_BASE64: ${{ secrets.ROOST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ROOST_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ROOST_KEYSTORE_BASE64 is not set; see the top of this workflow."
            exit 1
          fi
          echo "$ROOST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          ROOST_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ROOST_KEYSTORE_PASSWORD: ${{ secrets.ROOST_KEYSTORE_PASSWORD }}
          ROOST_KEY_ALIAS: ${{ secrets.ROOST_KEY_ALIAS }}
          ROOST_KEY_PASSWORD: ${{ secrets.ROOST_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name the APK
        id: apk
        run: |
          name="roost-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      # Not zipped, so the download is the APK itself; the artifact is named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false

      - name: Replace the "latest" release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.apk.outputs.path }}" roost.apk
          # Recreated every build: the tag moves to this commit, and a `latest` tag removed in
          # the meantime (e.g. by a mirror push that prunes refs) comes back.
          # No --cleanup-tag: it fails (HTTP 422) when the release outlived its tag; the tag is
          # deleted below only if it exists. `git/ref/` (singular) matches exactly, `git/refs/`
          # would also match by prefix (e.g. `latest-foo`).
          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --yes
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" > /dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest"
          fi
          gh release create latest roost.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7} on $GITHUB_REF_NAME: $(git log -1 --pretty=%s)

          Direct download: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/roost.apk"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --title "$GITHUB_REF_NAME" --generate-notes
