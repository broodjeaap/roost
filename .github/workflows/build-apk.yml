# Builds a signed, installable release APK.
#   - every push to main/master, and manual runs: APK attached to the run as an artifact
#   - tags v*: also published as a GitHub Release with the APK attached
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ROOST_KEYSTORE_BASE64    the release keystore, base64-encoded
#   ROOST_KEYSTORE_PASSWORD  keystore password
#   ROOST_KEY_ALIAS          key alias inside the keystore
#   ROOST_KEY_PASSWORD       key password
# Every build must be signed with the same key, or Android refuses to install it as an update.
name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create releases for tags
    steps:
      - uses: actions/checkout@v4

      # Matches gradle/gradle-daemon-jvm.properties, so Gradle doesn't download another JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          ROOST_KEYSTORE_BASE64: ${{ secrets.ROOST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ROOST_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ROOST_KEYSTORE_BASE64 is not set; see the top of this workflow."
            exit 1
          fi
          echo "$ROOST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          ROOST_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ROOST_KEYSTORE_PASSWORD: ${{ secrets.ROOST_KEYSTORE_PASSWORD }}
          ROOST_KEY_ALIAS: ${{ secrets.ROOST_KEY_ALIAS }}
          ROOST_KEY_PASSWORD: ${{ secrets.ROOST_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name the APK
        id: apk
        run: |
          name="roost-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --title "$GITHUB_REF_NAME" --generate-notes
